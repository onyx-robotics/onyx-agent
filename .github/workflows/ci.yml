name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install bubblewrap for sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun run ci
      - name: Verify cross-platform release binaries
        env:
          ONYX_POSTHOG_KEY: phc_ci_release_build
          ONYX_POSTHOG_HOST: https://e.onyxresearch.ai
        run: bun run build:release

  macos:
    name: macOS CI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run ci
