name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun run ci
      - name: Build official release binaries
        env:
          ONYX_POSTHOG_KEY: ${{ secrets.ONYX_POSTHOG_KEY }}
          ONYX_POSTHOG_HOST: https://e.onyxresearch.ai
        run: bun run build:release
      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/onyx-darwin-arm64
            dist/onyx-darwin-x64
            dist/onyx-linux-arm64
            dist/onyx-linux-x64-baseline
            dist/onyx-worker-darwin-arm64
            dist/onyx-worker-darwin-x64
            dist/onyx-worker-linux-arm64
            dist/onyx-worker-linux-x64-baseline
            dist/checksums.txt
            scripts/install.sh
      - name: Publish npm package
        run: npm publish --access public
